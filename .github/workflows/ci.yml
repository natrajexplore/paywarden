name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: SAST (bandit, medium+ severity fails the build)
        run: bandit -q -r app paywarden_mcp -ll
      - name: Dependency vulnerability audit (known CVEs fail the build)
        run: pip-audit -r requirements.txt -r requirements-mcp.txt
